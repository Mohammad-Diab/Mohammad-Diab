name: Metrics

on:
  # Refresh weekly (Sunday 03:00 UTC)
  schedule:
    - cron: "0 3 * * 0"
  # Run manually — use this for the FIRST run after adding the METRICS_TOKEN secret
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Commits this file into the repo → README references it as a static asset (never breaks)
          filename: metrics-languages.svg
          # No default header/stats block — just the languages card
          base: ""
          config_timezone: Asia/Dubai

          # --- Top languages ---
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Count only your own repos (keeps company/forked code out of the picture)
          plugin_languages_ignored: ""
          repositories_affiliations: owner
